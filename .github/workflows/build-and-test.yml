name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate's format stage diffs changed .cs files against origin/master,
          # so it needs full history rather than a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: the CLI has no way to pin individual service images, so
          # `latest` silently follows whatever `supabase start` bundles. CLI v2.115.0 (2026-08-18)
          # bundles supabase/realtime v2.129.0, which shipped a regression (v2.128.2, 2026-08-16,
          # PR supabase/realtime#2082 "bump phoenix" - swapped their custom presence-dispatcher
          # Phoenix fork for stock Phoenix 1.8): presence track/untrack and broadcast pushes never
          # get a phx_reply or presence_diff, so every push made through Push.cs times out - this
          # is what broke Track_ShouldSyncPresenceBetweenClients and the two Broadcast relay tests
          # in CI. Confirmed via a raw non-SDK websocket reproduction and bisection across
          # individual realtime image tags (v2.128.1: fine, v2.128.2: broken). v2.114.0 (2026-08-12)
          # is the last CLI release that predates the bad bump (bundles realtime v2.124.4). Bump
          # this once supabase/realtime restores the custom dispatcher or otherwise fixes the ack
          # path - re-verify with the E2E presence/broadcast tests before moving off this pin.
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      # Runs the same quality gate as contributors and agents (scripts/quality-gate).
      # Its exit code is the merge gate: build/analyzers, format, inner-loop tests,
      # dependency vulnerabilities, public-API sync and E2E/acceptance tests are all
      # blocking — a non-zero exit fails the job. Only the public-API diff is a
      # signal (breaking changes may be intentional), surfaced but non-blocking.
      - name: Quality gate
        run: ./scripts/quality-gate/gate.sh packages

