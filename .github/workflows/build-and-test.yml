name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The gate's format stage diffs changed .cs files against origin/master,
          # so it needs full history rather than a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      # Runs the same quality gate as contributors and agents (scripts/quality-gate).
      # Its exit code is the merge gate: build/analyzers, format, inner-loop tests,
      # dependency vulnerabilities, public-API sync and E2E/acceptance tests are all
      # blocking — a non-zero exit fails the job. Only the public-API diff is a
      # signal (breaking changes may be intentional), surfaced but non-blocking.
      - name: Quality gate
        run: ./scripts/quality-gate/gate.sh packages

